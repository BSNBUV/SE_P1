spring.application.name=astra-command
spring.application.name=astra-command
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/astra}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:astra}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:astra}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

astra.jwt.secret=${ASTRA_JWT_SECRET:dev-only-change-this-secret}
astra.validation.min-waypoints=${ASTRA_MIN_WAYPOINTS:2}
astra.validation.max-altitude-meters=${ASTRA_MAX_ALTITUDE_METERS:120}
astra.validation.min-altitude-meters=${ASTRA_MIN_ALTITUDE_METERS:5}
astra.validation.base-battery-cost=${ASTRA_BASE_BATTERY_COST:4.0}
astra.validation.cost-per-km=${ASTRA_COST_PER_KM:7.5}
astra.validation.altitude-cost-factor=${ASTRA_ALTITUDE_COST_FACTOR:0.025}
astra.validation.warning-reserve=${ASTRA_WARNING_RESERVE:25}
astra.validation.reject-reserve=${ASTRA_REJECT_RESERVE:10}
astra.simulation.tick-ms=${ASTRA_SIM_TICK_MS:750}
astra.simulation.low-battery-threshold=${ASTRA_LOW_BATTERY_THRESHOLD:15}
astra.simulation.telemetry-timeout-ms=${ASTRA_TELEMETRY_TIMEOUT_MS:3500}
