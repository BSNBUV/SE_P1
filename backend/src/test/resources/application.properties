spring.datasource.url=jdbc:h2:mem:astra-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.data.redis.host=localhost
spring.data.redis.port=6379
astra.jwt.secret=test-secret
astra.validation.min-waypoints=2
astra.validation.max-altitude-meters=120
astra.validation.min-altitude-meters=5
astra.validation.base-battery-cost=4.0
astra.validation.cost-per-km=7.5
astra.validation.altitude-cost-factor=0.025
astra.validation.warning-reserve=25
astra.validation.reject-reserve=10
astra.simulation.tick-ms=100
astra.simulation.low-battery-threshold=15
astra.simulation.telemetry-timeout-ms=3500
